<head>

<title>Михаил Масликов — учитель информатики · Точка будущего</title>

    scr-oge-01-overview.png, scr-oge-02-catalog.png, scr-oge-03-task.png,
    scr-turtle-01-hero.png, scr-turtle-02-lessons.png, scr-turtle-03-worksheet.png,
    scr-tpg-01-hero.png, scr-tpg-02-stages.png, scr-tpg-03-team.png
  JPG: галерея, 6 кадров, все строго 4:5 · 1200×1500:
    photo-gallery-bw.jpg     (2.JPG) · «Ночь перед дедлайном модуля»
    photo-teach.jpg          (6.JPG) · «С учениками за компьютерами»
    photo-gallery-code.jpg   (9.JPG) · «Код на проекции во время занятия»

<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73;
  --line:rgba(0,0,0,.09); --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --radius:24px; --radius-s:16px; --shadow:0 12px 34px rgba(0,0,0,.09);
  --nav-h:64px; --ok:#34c759; --err:#ff3b30;
  --pad:clamp(20px,4vw,48px);
  --wrap:1320px;
}
[data-theme="dark"]{
  --bg:#0b0b0f; --surface:#17171c; --surface-2:#1e1e24; --text:#f5f5f7; --muted:#9b9ba1;
  --line:rgba(255,255,255,.11); --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --shadow:0 14px 40px rgba(0,0,0,.55);
}
/* цвета проектов */
.acc-webdev{--acc:#ff9f0a;--acc-soft:rgba(255,159,10,.15)}  [data-theme="dark"] .acc-webdev{--acc:#ff9f0a;--acc-soft:rgba(255,159,10,.24)}
.acc-python{--acc:#0071e3;--acc-soft:rgba(0,113,227,.12)}   [data-theme="dark"] .acc-python{--acc:#0a84ff;--acc-soft:rgba(10,132,255,.24)}
.acc-ege{--acc:#ff3b30;--acc-soft:rgba(255,59,48,.12)}      [data-theme="dark"] .acc-ege{--acc:#ff453a;--acc-soft:rgba(255,69,58,.24)}
.acc-oge{--acc:#ff2d55;--acc-soft:rgba(255,45,85,.12)}      [data-theme="dark"] .acc-oge{--acc:#ff375f;--acc-soft:rgba(255,55,95,.24)}
.acc-turtle{--acc:#34c759;--acc-soft:rgba(52,199,89,.15)}   [data-theme="dark"] .acc-turtle{--acc:#30d158;--acc-soft:rgba(48,209,88,.24)}
.acc-tpg{--acc:#af52de;--acc-soft:rgba(175,82,222,.15)}     [data-theme="dark"] .acc-tpg{--acc:#bf5af2;--acc-soft:rgba(191,90,242,.24)}
/* приглушённая палитра фонов секций */
.sec--blue{background:color-mix(in srgb,#0071e3 9%,var(--bg))}
.sec--slate{background:color-mix(in srgb,#334155 9%,var(--bg))}
.sec--teal{background:color-mix(in srgb,#0d9488 9%,var(--bg))}
.sec--terra{background:color-mix(in srgb,#b45309 8%,var(--bg))}

/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:17.5px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.12;margin:0}
h1{font-size:clamp(32px,5.2vw,76px);font-weight:700}
h1 .h-line{display:block;white-space:nowrap}
h1 .h-line.acc{color:var(--accent)}
h2{font-size:clamp(28px,3.4vw,50px);font-weight:700}
h3{font-size:21px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.sec{padding:clamp(60px,7vw,110px) 0}
.sec-head{margin-bottom:clamp(28px,3vw,48px)}
.sec-head.center{text-align:center;max-width:860px;margin-inline:auto}
.sec-head.center .sec-lead{margin-inline:auto}
.sec-kicker{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-lead{color:var(--muted);margin-top:12px;max-width:720px;font-size:clamp(17px,1.5vw,20px)}
.j{text-align:justify;hyphens:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;
  border-radius:980px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;
  cursor:pointer;text-decoration:none;transition:transform .18s,opacity .18s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--accent-soft);color:var(--acc,var(--accent))}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:980px;background:var(--surface);
  border:1px solid var(--line);font-size:14px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:var(--nav-h);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;text-decoration:none;color:var(--text);min-height:44px}
.logo-m{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5ac8fa);
  color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.nav-links{display:none;gap:4px;margin-left:auto}
.nav-links a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500;padding:10px 14px;border-radius:980px;min-height:44px;display:inline-flex;align-items:center}
.nav-links a:hover{color:var(--text);background:var(--accent-soft)}
.nav-links a.active{color:var(--text);background:var(--accent-soft)}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-links + .nav-actions{margin-left:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s;flex:none}
.icon-btn:hover{transform:scale(1.06)}
.burger{display:grid}
@media (min-width:960px){.nav-links{display:flex}.burger{display:none}}
.menu{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:49;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px var(--pad) 20px;display:grid;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.menu a{color:var(--text);text-decoration:none;font-size:18px;font-weight:600;padding:12px 14px;border-radius:14px;min-height:48px;display:flex;align-items:center}
.menu a:hover{background:var(--accent-soft)}

/* ============ HERO: белый фон на весь блок, фото без подложки и обводки ============ */
.hero{background:var(--surface);
  min-height:calc(100vh - var(--nav-h));min-height:calc(100svh - var(--nav-h));
  display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,5vw,72px) 0 clamp(28px,3vw,48px)}
.hero-grid{display:grid;gap:clamp(28px,3vw,48px);align-items:center}
@media (min-width:960px){.hero-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr)}}
.hero-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:980px;
  border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.hero-pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.hero h1{margin:18px 0 20px}
.hero-role{font-size:clamp(17px,1.6vw,22px);color:var(--muted);max-width:580px}
.hero-school{font-weight:600;color:var(--text)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-proof{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;margin-top:24px}
.hero-proof svg{color:var(--ok);flex:none;width:22px;height:22px}
.hero-stage{position:relative;max-width:480px;margin-inline:auto;width:100%}
.hero-photo{margin:0;position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:220px 220px 28px 28px}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  opacity:0;transition:opacity .6s}
.hero-photo.is-loaded img{opacity:1}
.hero-photo.is-missing img{display:none}
.photo-ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;color:var(--muted);background:var(--surface-2);border:1.5px dashed var(--line);border-radius:24px}
.is-missing .photo-ph{display:flex}
.photo-ph svg{opacity:.55}
.ph-file{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;opacity:.8;word-break:break-all}
.strip{margin-top:clamp(30px,4vw,56px);padding:24px clamp(18px,2.4vw,32px);border-radius:20px;
  background:color-mix(in srgb,var(--accent) 6%,var(--surface));border:1px solid var(--line)}
.strip>p{text-align:center;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin-top:12px}
@media (min-width:960px){.marks{justify-content:space-between}}
.mark{display:flex;align-items:center;gap:9px;font:inherit;font-size:16px;font-weight:700;color:var(--muted);
  background:none;border:0;cursor:pointer;padding:8px 14px;border-radius:12px;min-height:48px;transition:color .2s,background .2s}
.mark svg{width:22px;height:22px;color:var(--acc,var(--accent))}
.mark:hover{color:var(--acc,var(--accent));background:var(--acc-soft,var(--accent-soft))}

/* ============ ОБО МНЕ: карточки-подложки ============ */
.about-grid{display:grid;gap:16px;max-width:1120px;margin-inline:auto}
@media (min-width:900px){.about-grid{grid-template-columns:1fr 1fr}}
.about-card{padding:clamp(20px,2.4vw,30px);border-radius:20px;background:var(--surface);border:1px solid var(--line);
  display:grid;gap:14px;justify-items:start;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.about-card:hover{transform:translateY(-3px)}
.about-card .ai{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--aic) 15%,transparent);color:var(--aic)}
.about-card .ai svg{width:26px;height:26px}
.a-blue{--aic:#0071e3}.a-slate{--aic:#334155}.a-teal{--aic:#0d9488}.a-terra{--aic:#b45309}
[data-theme="dark"] .a-blue{--aic:#0a84ff}[data-theme="dark"] .a-slate{--aic:#94a3b8}
[data-theme="dark"] .a-teal{--aic:#14b8a6}[data-theme="dark"] .a-terra{--aic:#d97706}
.about-card h3{font-size:19px}
.about-card p{color:var(--muted);font-size:16px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}

/* ============ РАЗРАБОТКИ: 3 + 3 ============ */
.cards{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
.pcard{padding:26px;display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--acc)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.pcard-ico svg{width:28px;height:28px}
.lock-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:980px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lock-badge.open{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pcard h3{font-size:21px}
.pcard .tag{color:var(--muted);font-size:15.5px;flex:1}
.pcard-meta{display:flex;flex-wrap:wrap;gap:6px}
.pcard-cta{align-self:flex-start;min-height:48px}

/* ============ ПРИНЦИПЫ: 3 + 3 ============ */
.benefits{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:700px){.benefits{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.benefits{grid-template-columns:repeat(3,1fr)}}
.benefit{display:flex;gap:16px;align-items:flex-start;padding:24px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.benefit:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.benefit .bi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--bic) 15%,transparent);color:var(--bic)}
.benefit .bi svg{width:26px;height:26px}
.b-blue{--bic:#0071e3}.b-teal{--bic:#0d9488}.b-terra{--bic:#b45309}.b-slate{--bic:#334155}
[data-theme="dark"] .b-blue{--bic:#0a84ff}[data-theme="dark"] .b-teal{--bic:#14b8a6}
[data-theme="dark"] .b-terra{--bic:#d97706}[data-theme="dark"] .b-slate{--bic:#94a3b8}
.benefit h3{font-size:19px;margin-bottom:6px}
.benefit p{font-size:15.5px;color:var(--muted)}

/* ============ ШКОЛА / ТПГ ============ */
.school-cols{max-width:1060px;margin-inline:auto}
.tpg{padding:clamp(22px,2.6vw,34px);border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-top:24px;box-shadow:var(--shadow)}
.tpg-head{display:flex;align-items:center;gap:16px}
.tpg-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:rgba(175,82,222,.15);color:#af52de}
[data-theme="dark"] .tpg-ico{background:rgba(191,90,242,.22);color:#bf5af2}
.tpg-ico svg{width:28px;height:28px}
.tpg ul{margin:16px 0 0;padding:0;list-style:none;color:var(--muted);font-size:16px;display:grid;gap:10px}
.tpg ul li{display:flex;gap:10px;align-items:flex-start}
.tpg ul li svg{flex:none;width:19px;height:19px;color:var(--accent);margin-top:4px}
.tpg-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ============ ГАЛЕРЕЯ: 3 + 3, JPG ============ */
.gal-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.gal-grid{grid-template-columns:repeat(3,1fr)}}
.gal-item{margin:0;display:grid;gap:10px}
.gal-photo{margin:0;position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line)}
.gal-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;
  opacity:0;transition:opacity .6s,transform .6s}
.gal-photo.is-loaded img{opacity:1}
.gal-photo.is-missing img{display:none}
.gal-item:hover .gal-photo img{transform:scale(1.04)}
.gal-item figcaption{font-size:14.5px;color:var(--muted);text-align:center;padding:0 6px}

/* ============ FOOTER: контакты и копи по центру ============ */
.footer{border-top:1px solid var(--line);padding:clamp(40px,5vw,64px) 0;background:var(--surface-2)}
.footer-in{display:grid;justify-items:center;gap:22px;text-align:center}
.f-title{font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-.02em}
.f-contacts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.crow{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:16px;background:var(--surface);
  overflow:hidden;transition:border-color .2s,transform .2s;flex:0 1 340px;min-width:280px}
.crow:hover{border-color:var(--cic,var(--accent));transform:translateY(-2px)}
.crow-a{flex:1;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:60px;text-decoration:none;color:var(--text)}
.ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;
  background:color-mix(in srgb,var(--cic) 15%,transparent);color:var(--cic)}
.ci svg{width:21px;height:21px}
.ci-mail{--cic:#b45309}.ci-tg{--cic:#0071e3}.ci-vk{--cic:#334155}
[data-theme="dark"] .ci-mail{--cic:#d97706}[data-theme="dark"] .ci-tg{--cic:#0a84ff}[data-theme="dark"] .ci-vk{--cic:#94a3b8}
.ct{display:grid;line-height:1.3;min-width:0;text-align:left}
.ct small{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ct b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cext{color:var(--muted);margin-left:auto;flex:none}
.copy-mini{width:54px;flex:none;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.copy-mini svg{width:19px;height:19px}
.copy-mini:hover{color:var(--cic,var(--accent));background:color-mix(in srgb,var(--cic,#0071e3) 12%,transparent)}
.f-copy{color:var(--muted);font-size:15.5px}

/* ============ SHEET ============ */
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:var(--nav-h);padding:0 16px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
.sheet-body{max-width:1040px;margin:0 auto;padding:36px 20px 90px}
.sheet-hero{display:grid;gap:8px;margin-bottom:28px}
.sheet-hero .chip-row{justify-content:flex-start;margin-top:10px}
.sheet-sec{margin-top:36px}
.sheet-sec h3{font-size:24px;margin-bottom:14px}
.shots{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.shot{margin:0;display:grid;gap:10px}
.shot-frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:16/10}
.shot-frame img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s;cursor:zoom-in}
.shot-frame.is-loaded img{opacity:1}
.shot-frame.is-missing img{display:none}
.shot-frame .photo-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  padding:12px;text-align:center;color:var(--muted);background:var(--surface-2);border:0}
.shot-frame.is-missing .photo-ph{display:flex}
.shot figcaption{font-size:14.5px;color:var(--muted)}
.sheet-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}
.note{padding:18px 20px;border-radius:14px;background:var(--acc-soft,var(--accent-soft));font-size:15.5px;color:var(--text)}

/* ============ МОДАЛКИ ============ */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:min(480px,100%);padding:30px;border-radius:28px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;gap:18px;transform:scale(.96);transition:transform .28s}
.modal.open .modal-card{transform:none}
.modal-card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.gate-ico{width:64px;height:64px;border-radius:20px;background:var(--acc-soft,var(--accent-soft));color:var(--acc,var(--accent));display:grid;place-items:center}
.gate-ico svg{width:26px;height:26px}
.gate-ico.unlocked{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.gate-err{font-size:14px;color:var(--err);min-height:20px}
.gate-hint{font-size:15px;color:var(--muted)}
/* поля ввода (восстановлены для окна кода) */
.field{display:grid;gap:7px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;min-height:50px;width:100%}
.field input:focus{outline:3px solid var(--accent);outline-offset:2px}
/* лайтбокс: крупнее, чтобы разглядеть скриншот */
.lb{z-index:95}
.lb-card{width:min(1440px,100%);padding:16px;border-radius:22px;background:rgba(20,20,24,.9);border:1px solid rgba(255,255,255,.14)}
.lb-frame{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-height:78vh;background:#111}
.lb-frame img{width:100%;height:100%;object-fit:contain}
.lb-frame .photo-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#bbb;border:0;background:transparent}
.lb-frame.is-missing img{display:none}
.lb-frame.is-missing .photo-ph{display:flex}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 2px;color:#eee;font-size:15px}
.lb-nav{display:flex;gap:8px}
.lb .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}

/* ============ TOAST ============ */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:100;padding:13px 22px;border-radius:980px;
  background:var(--text);color:var(--bg);font-size:15px;font-weight:600;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function djb2(s){ let h=5381; for (const ch of s){ h=((h*33)^ch.codePointAt(0))>>>0; } return h.toString(16).padStart(8,"0"); }
async function sha256(s){
  if (!crypto?.subtle) return null;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const normCode = s => s.trim().toUpperCase().replace(/\s+/g,"");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function bindImages(root){
  $$("img[data-file]", root).forEach(img=>{
    const f = img.dataset.file;
    const frame = img.closest(".hero-photo, .gal-photo, .shot-frame, .lb-frame");
    if (missingFiles.has(f)){ frame?.classList.add("is-missing"); return; }
    img.addEventListener("error", ()=>{ missingFiles.add(f); frame?.classList.add("is-missing"); });
    img.addEventListener("load", ()=>frame?.classList.add("is-loaded"));
    if (img.complete && img.naturalWidth>0) frame?.classList.add("is-loaded");
  });
}
function trapTab(e, box){
  if (e.key!=="Tab") return;
  const f = $$('button, a[href], input, textarea, [tabindex]:not([tabindex="-1"])', box).filter(el=>!el.disabled && el.offsetParent!==null);
  if (!f.length) return;
  const first=f[0], last=f[f.length-1];
  if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
}
function syncScrollLock(){ document.body.classList.toggle("lock", !!(state.sheetId||state.gateFor||state.lb||state.menu)); }

/* ================= GATE ================= */
async function verifyCode(raw){
  const code = normCode(raw);
  if (!code) return {empty:true};
  const sha = await sha256(code);
  for (const [key,h] of Object.entries(CODE_HASHES)){
    if (sha ? sha===h.sha : djb2(code)===h.djb2) return {key};
  }
  return {};
}

  return `

    <h3 id="gate-title">Код доступа · ${esc(p.title)}</h3>

    <div class="field"><label for="gate-input">Код</label><input id="gate-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Введите код доступа"><span class="gate-err" id="gate-err" aria-live="polite"></span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="gate-ok" type="button">Открыть переход</button>

function gateSuccessHTML(p, isMaster){
  const link = isMaster ? "" : `<a class="btn" id="gate-go" href="${p.url}" target="_blank" rel="noopener">Перейти к ресурсу ${ICONS.ext}</a>`;

      ${link}
      <button class="btn ghost" id="gate-stay" type="button">Остаться на сайте</button>
    </div>`;
}
function openGate(forId){
  state.gateFor = forId; state.attempts = 0; stopCooldown();
  $("#gate-card").className = "modal-card";
  $("#gate-card").innerHTML = gateInputHTML(PROJECTS.find(x=>x.id===forId));
  $("#gate").classList.add("open"); syncScrollLock();
  state.lastFocus = document.activeElement;
  setTimeout(()=>$("#gate-input")?.focus(), 60);
}
function closeGate(){
  state.gateFor = null; stopCooldown();
  $("#gate").classList.remove("open"); syncScrollLock();
  state.lastFocus?.focus?.();
}
function stopCooldown(){ clearInterval(state.cooldownTimer); state.cooldownTimer=null; state.cooldown=0; }
async function submitGate(){
  if (state.cooldown>0 || !state.gateFor) return;
  const res = await verifyCode($("#gate-input")?.value ?? "");
  if (res.empty){ $("#gate-err").textContent = "Введите код — поле пустое."; shake(); return; }
  if (!res.key){
    state.attempts++;
    if (state.attempts>=5){ startCooldown(); } else { $("#gate-err").textContent = "Неверный код. Уточните у учителя или проверьте символы."; }
    shake(); return;
  }
  const isMaster = res.key==="master";
  if (isMaster) PROJECTS.forEach(p=>state.unlocked.add(p.id));
  else state.unlocked.add(res.key);
  syncLockUI();
  if (state.sheetId) renderSheetActions(PROJECTS.find(p=>p.id===state.sheetId));
  const p = PROJECTS.find(x=>x.id===res.key);
  $("#gate-card").innerHTML = gateSuccessHTML(p, isMaster);
  toast(isMaster ? "Мастер-код: открыты все переходы" : "Переход открыт: "+p.title);
  setTimeout(()=>$("#gate-go")?.focus(), 60);
}
function shake(){ const c=$("#gate-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
function startCooldown(){
  state.cooldown = 15;
  const ok=$("#gate-ok"), inp=$("#gate-input");
  if(ok) ok.disabled = true; if(inp) inp.disabled = true;
  const tick = ()=>{ const e=$("#gate-err"); if(e) e.textContent = `Слишком много попыток. Повторите через ${state.cooldown} с.`;
    if (--state.cooldown < 0){ stopCooldown(); state.attempts=0;
      const e2=$("#gate-err"); if(e2) e2.textContent="";
      const ok2=$("#gate-ok"), inp2=$("#gate-input");
      if(ok2) ok2.disabled=false; if(inp2){ inp2.disabled=false; inp2.focus(); } } };
  tick(); state.cooldownTimer = setInterval(tick, 1000);
}

  history.replaceState(null,"","#/dev/"+id);
  const sheet = $("#sheet");
  sheet.className = "sheet acc-"+p.id;
  sheet.innerHTML = `
    <div class="sheet-bar">
      <button class="icon-btn" id="sheet-close" type="button" aria-label="Закрыть">${ICONS.close}</button>
      <strong style="font-size:16px">${esc(p.title)}</strong>
      <span class="lock-badge" id="sheet-linkbadge" style="margin-left:auto"></span>
    </div>
    <div class="sheet-body">
      <div class="sheet-hero">
        <span class="sec-kicker">Разработка · ${esc(p.status)}</span>
        <h2 id="sheet-title">${esc(p.title)}</h2>
        <p class="sec-lead">${esc(p.tagline)}</p>
        <div class="chip-row"><span class="chip">${esc(p.audience)}</span><span class="chip">${esc(p.volume)}</span><span class="chip">Автор: Масликов М. М.</span></div>
      </div>
      <div class="sheet-sec"><h3>Что это</h3>${p.about.map(t=>`<p class="j" style="color:var(--muted);margin-bottom:12px;font-size:16.5px">${esc(t)}</p>`).join("")}</div>
      <div class="sheet-sec"><h3>Что внутри</h3>
        <ul style="margin:0;padding-left:22px;color:var(--muted);display:grid;gap:9px;font-size:16px">${p.inside.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
      </div>
      <div class="sheet-sec"><h3>Скриншоты</h3>
        <div class="shots">${p.shots.map((s,i)=>`
          <figure class="shot">
            <div class="shot-frame"><img data-file="${s[0]}" src="${IMG}${s[0]}" alt="${esc(s[1])} — скриншот ресурса «${esc(p.title)}»" loading="lazy" decoding="async" data-lb="${i}">
              <div class="photo-ph" aria-hidden="true">${ICONS.cam}<span class="ph-file">${IMG}${s[0]}</span></div></div>
            <figcaption>${esc(s[1])}</figcaption>
          </figure>`).join("")}</div>
      </div>
      <div class="sheet-sec"><div class="note">Описание и скриншоты открыты без кода. Кнопка «Открыть ресурс» становится доступна после ввода кода доступа — код выдаёт лично учитель.</div></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>`;
  renderSheetActions(p);
  requestAnimationFrame(()=>sheet.classList.add("open"));
  syncScrollLock(); bindImages(sheet);
  $$("img[data-lb]", sheet).forEach(img=>img.addEventListener("click", ()=>openLb(id, +img.dataset.lb)));
  state.lastFocus = document.activeElement;
  setTimeout(()=>$("#sheet-close").focus(), 80);
}
function closeSheet(){
  const sheet = $("#sheet");
  if (!state.sheetId) return;
  state.sheetId = null;
  sheet.classList.remove("open"); syncScrollLock();
  history.replaceState(null,"",location.pathname+location.search);
  setTimeout(()=>{ if(!state.sheetId) sheet.innerHTML=""; }, 450);
  state.lastFocus?.focus?.();
}

/* ================= LIGHTBOX ================= */
function openLb(pid, idx){
  state.lb = {pid, idx}; state.lastFocus = document.activeElement;
  drawLb(); $("#lb").classList.add("open"); syncScrollLock(); setTimeout(()=>$("#lb-close").focus(),60);
}
function drawLb(){
  const p = PROJECTS.find(x=>x.id===state.lb.pid); const [file, cap] = p.shots[state.lb.idx];
  const frame = $("#lb-frame");
  frame.className = "lb-frame" + (missingFiles.has(file) ? " is-missing" : "");
  frame.innerHTML = `<img src="${IMG}${file}" alt="${esc(cap)} — увеличенный скриншот">
    <div class="photo-ph">${ICONS.cam}<span class="ph-file">${IMG}${file}</span></div>`;
  bindImages(frame);
  $("#lb-cap").textContent = `${p.title} · ${state.lb.idx+1} / ${p.shots.length} — ${cap}`;
}
function stepLb(d){ const p=PROJECTS.find(x=>x.id===state.lb.pid); state.lb.idx=(state.lb.idx+d+p.shots.length)%p.shots.length; drawLb(); }
function closeLb(){ state.lb=null; $("#lb").classList.remove("open"); syncScrollLock(); state.lastFocus?.focus?.(); }

/* ================= ТЕМА ================= */
function resolvedTheme(){ return state.theme==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : state.theme; }
function applyTheme(){ document.documentElement.dataset.theme = resolvedTheme();
  $("#theme-btn").innerHTML = resolvedTheme()==="dark" ? ICONS.sun : ICONS.moon;
  $("#theme-btn").setAttribute("aria-label", resolvedTheme()==="dark"?"Светлая тема":"Тёмная тема"); }
function toggleTheme(){ state.theme = resolvedTheme()==="dark" ? "light" : "dark";
  try{ localStorage.setItem(LS_THEME, state.theme); }catch(e){} applyTheme(); }

/* ================= ROUTER / SPY / REVEAL ================= */
function hashProjectId(){ const m = location.hash.match(/^#\/dev\/([a-z]+)/); return m ? m[1] : null; }
function syncRoute(){
  const id = hashProjectId();
  if (id && PROJECTS.some(p=>p.id===id)){ if (state.sheetId!==id) openSheet(id); }
  else if (!id && state.sheetId) closeSheet();
}
function initSpy(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if (en.isIntersecting){ $$(".nav-links a").forEach(a=>a.classList.toggle("active", a.dataset.spy===en.target.id)); }
  }), {rootMargin:"-40% 0px -55% 0px"});
  ["about","works","principles","school","gallery","contacts"].forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}
function initReveal(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});
  $$(".rv").forEach(el=>io.observe(el));
}

/* ================= HANDLERS ================= */
function bindHandlers(){
  $("#theme-btn").addEventListener("click", toggleTheme);
  $("#burger").addEventListener("click", ()=>{ state.menu=!state.menu; $("#menu").classList.toggle("open",state.menu); $("#burger").setAttribute("aria-expanded",String(state.menu)); syncScrollLock(); });
  $$("#menu a").forEach(a=>a.addEventListener("click", ()=>{ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); syncScrollLock(); }));
  document.addEventListener("click", e=>{
    const t = e.target.closest("[data-open]");
    if (t) openSheet(t.dataset.open);
  });
  $("#gate-card").addEventListener("click", e=>{
    if (e.target.closest("#gate-ok")) submitGate();
    else if (e.target.closest("#gate-cancel")) closeGate();
    else if (e.target.closest("#gate-stay")) closeGate();
  });
  $("#sheet").addEventListener("click", e=>{
    if (e.target.closest("#sheet-close")) closeSheet();
    else if (e.target.closest("#sheet-open")?.tagName==="BUTTON") openGate(state.sheetId);
  });
  $("#lb-close").addEventListener("click", closeLb);
  $("#lb-prev").addEventListener("click", ()=>stepLb(-1));
  $("#lb-next").addEventListener("click", ()=>stepLb(1));
  $("#copy-mail").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText("mmmaslikov@gmail.com"); toast("Email скопирован"); }
    catch(e){ toast("Email: mmmaslikov@gmail.com"); }
  });
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape"){
      if (state.lb) closeLb();
      else if (state.gateFor) closeGate();
      else if (state.sheetId) closeSheet();
      else if (state.menu){ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); syncScrollLock(); }
    }
    if (state.gateFor && e.key==="Enter" && document.activeElement===$("#gate-input")){ e.preventDefault(); submitGate(); }
    if (state.lb && e.key==="ArrowRight") stepLb(1);
    if (state.lb && e.key==="ArrowLeft") stepLb(-1);
    if (state.gateFor) trapTab(e, $("#gate-card"));
    else if (state.lb) trapTab(e, $(".lb-card"));
    else if (state.sheetId) trapTab(e, $("#sheet"));
  });
  window.addEventListener("hashchange", syncRoute);
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener?.("change", ()=>{ if(state.theme==="auto") applyTheme(); });
}

/* ================= INIT ================= */
function init(){
  try{ const t = localStorage.getItem(LS_THEME); if (t==="light"||t==="dark") state.theme = t; }catch(e){}
  renderApp();
  bindHandlers();
  applyTheme();
  initSpy(); initReveal();
  syncRoute();
}
init();
</script>
</body>
</html>
