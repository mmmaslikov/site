<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73;
  --line:rgba(0,0,0,.09); --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --radius:24px; --radius-s:16px; --shadow:0 12px 34px rgba(0,0,0,.09);
  --nav-h:60px; --acc:#0071e3; --acc-soft:rgba(0,113,227,.12);
  --ok:#34c759; --err:#ff3b30;
}
[data-theme="dark"]{
  --bg:#0b0b0f; --surface:#17171c; --surface-2:#1e1e24; --text:#f5f5f7; --muted:#9b9ba1;
  --line:rgba(255,255,255,.11); --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --shadow:0 14px 40px rgba(0,0,0,.55);
}
/* акценты проектов */
.acc-webdev{--acc:#ff9f0a;--acc-soft:rgba(255,159,10,.14)}   [data-theme="dark"] .acc-webdev{--acc:#ff9f0a;--acc-soft:rgba(255,159,10,.22)}
.acc-python{--acc:#0071e3;--acc-soft:rgba(0,113,227,.12)}    [data-theme="dark"] .acc-python{--acc:#0a84ff;--acc-soft:rgba(10,132,255,.22)}
.acc-ege{--acc:#ff3b30;--acc-soft:rgba(255,59,48,.12)}       [data-theme="dark"] .acc-ege{--acc:#ff453a;--acc-soft:rgba(255,69,58,.22)}
.acc-oge{--acc:#ff2d55;--acc-soft:rgba(255,45,85,.12)}       [data-theme="dark"] .acc-oge{--acc:#ff375f;--acc-soft:rgba(255,55,95,.22)}
.acc-turtle{--acc:#34c759;--acc-soft:rgba(52,199,89,.14)}    [data-theme="dark"] .acc-turtle{--acc:#30d158;--acc-soft:rgba(48,209,88,.22)}
.acc-tpg{--acc:#af52de;--acc-soft:rgba(175,82,222,.14)}      [data-theme="dark"] .acc-tpg{--acc:#bf5af2;--acc-soft:rgba(191,90,242,.22)}

/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;margin:0}
h1{font-size:clamp(28px,8.5vw,64px);font-weight:700}
h1 .h-line{display:block;white-space:nowrap} /* слоган всегда в две строки */
h2{font-size:clamp(26px,4.4vw,44px);font-weight:700}
h3{font-size:20px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sec{padding:72px 0}
.sec-head{margin-bottom:34px}
.sec-kicker{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-lead{color:var(--muted);margin-top:12px;max-width:640px;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;
  border-radius:980px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;
  cursor:pointer;text-decoration:none;transition:transform .18s,opacity .18s,background .18s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:980px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;padding:0 20px;height:var(--nav-h);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--text);min-height:44px}
.logo-m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5ac8fa);
  color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:0}
.nav-links{display:none;gap:4px;margin-left:auto}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:10px 12px;border-radius:980px;min-height:44px;display:inline-flex;align-items:center}
.nav-links a:hover{color:var(--text);background:var(--accent-soft)}
.nav-links a.active{color:var(--text);background:var(--accent-soft)}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-links + .nav-actions{margin-left:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s;flex:none}
.icon-btn:hover{transform:scale(1.06)}
.burger{display:grid}
@media (min-width:900px){.nav-links{display:flex}.burger{display:none}}
.menu{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:49;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 20px 20px;display:grid;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.menu a{color:var(--text);text-decoration:none;font-size:17px;font-weight:600;padding:12px 14px;border-radius:14px;min-height:44px;display:flex;align-items:center}
.menu a:hover{background:var(--accent-soft)}

/* ============ HERO ============ */
.hero{padding:56px 0 64px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--accent-soft),transparent 65%);pointer-events:none}
.hero-grid{display:grid;gap:36px;align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.hero h1{margin:14px 0 18px}
.hero-role{font-size:clamp(17px,2.4vw,21px);color:var(--muted);max-width:520px}
.hero-school{font-weight:600;color:var(--text)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:36px}
@media (min-width:700px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{padding:16px 18px;border-radius:var(--radius-s);background:var(--surface);border:1px solid var(--line)}
.fact b{display:block;font-size:28px;letter-spacing:-.02em}
.fact span{font-size:13px;color:var(--muted)}
/* фото-фигуры с плейсхолдером */
.photo{margin:0;position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.photo.is-loaded img{opacity:1}
.photo.is-missing img{display:none}
.photo-ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;color:var(--muted);
  background:linear-gradient(140deg,var(--acc-soft),transparent 70%),var(--surface-2)}
.photo.is-missing .photo-ph{display:flex}
.photo-ph svg{opacity:.55}
.ph-file{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;opacity:.75;word-break:break-all}
.photo-hero{aspect-ratio:4/5;max-height:520px}
@media (min-width:900px){.photo-hero{aspect-ratio:4/4.4}}

/* ============ ОБО МНЕ / ПРИНЦИПЫ ============ */
.split{display:grid;gap:32px;align-items:start}
@media (min-width:900px){.split{grid-template-columns:.9fr 1.1fr}}
.bio p+p{margin-top:14px}
.bio .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.principles{display:grid;gap:16px;margin-top:8px}
@media (min-width:760px){.principles{grid-template-columns:1fr 1fr}}
.principle{padding:26px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.principle:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.principle .num{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.principle h3{margin:8px 0 10px}
.principle p{color:var(--muted);font-size:15px}

/* ============ РАЗРАБОТКИ ============ */
.cards{display:grid;gap:18px}
@media (min-width:760px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.cards{grid-template-columns:repeat(3,1fr)}}
.pcard{padding:24px;display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--acc)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.lock-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:980px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lock-badge.open{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pcard h3{font-size:19px}
.pcard .tag{color:var(--muted);font-size:14px;flex:1}
.pcard-meta{display:flex;flex-wrap:wrap;gap:6px}
.pcard-cta{align-self:flex-start;min-height:44px}

/* ============ ШКОЛА / ТПГ ============ */
.school-grid{display:grid;gap:24px}
@media (min-width:900px){.school-grid{grid-template-columns:1fr 1fr}}
.school-photo{aspect-ratio:16/10}
.tpg{padding:26px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
.tpg ul{margin:14px 0 0;padding-left:20px;color:var(--muted);font-size:15px;display:grid;gap:8px}
.tpg-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* ============ ГАЛЕРЕЯ ============ */
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:min(78vw,340px);gap:16px;overflow-x:auto;
  scroll-snap-type:x mandatory;padding:4px 20px 18px;margin:0 -20px}
.gal figure{margin:0;scroll-snap-align:center}
.gal .photo{aspect-ratio:3/3.4}
.gal figcaption{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

/* ============ КОНТАКТЫ ============ */
.contact-grid{display:grid;gap:28px}
@media (min-width:900px){.contact-grid{grid-template-columns:1fr 1fr}}
.contact-chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.cchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:980px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.cchip:hover{border-color:var(--accent);color:var(--accent)}
.form{display:grid;gap:14px;padding:26px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;min-height:44px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--err)}
.ferr{font-size:12.5px;color:var(--err);min-height:16px}
.thanks{padding:26px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);display:grid;gap:14px;justify-items:start}
.thanks .ok-ico{width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center}

/* ============ FOOTER ============ */
.footer{border-top:1px solid var(--line);padding:34px 0 44px;margin-top:40px}
.footer-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.footer p{color:var(--muted);font-size:14px}

/* ============ SHEET (деталка разработки) ============ */
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:var(--nav-h);padding:0 16px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
.sheet-body{max-width:880px;margin:0 auto;padding:34px 20px 90px}
.sheet-hero{display:grid;gap:8px;margin-bottom:26px}
.sheet-hero .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sheet-sec{margin-top:34px}
.sheet-sec h3{font-size:22px;margin-bottom:14px}
.shots{display:grid;gap:18px}
@media (min-width:760px){.shots{grid-template-columns:repeat(3,1fr)}}
.shot{margin:0;display:grid;gap:10px}
.shot-frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:4/3}
.shot-frame img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s;cursor:zoom-in}
.shot-frame.is-loaded img{opacity:1}
.shot-frame.is-missing img{display:none}
.shot-frame .photo-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  padding:12px;text-align:center;color:var(--muted);background:linear-gradient(140deg,var(--acc-soft),transparent 70%),var(--surface-2)}
.shot-frame.is-missing .photo-ph{display:flex}
.shot figcaption{font-size:13px;color:var(--muted)}
.sheet-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.note{padding:16px 18px;border-radius:14px;background:var(--acc-soft);font-size:14px;color:var(--text)}

/* ============ МОДАЛКИ: GATE + LIGHTBOX ============ */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:min(440px,100%);padding:28px;border-radius:28px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;gap:16px;transform:scale(.96);transition:transform .28s}
.modal.open .modal-card{transform:none}
.modal-card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.gate-ico{width:56px;height:56px;border-radius:18px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.gate-ico.unlocked{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.gate-err{font-size:13.5px;color:var(--err);min-height:20px}
.gate-hint{font-size:13.5px;color:var(--muted)}
.lb{z-index:95}
.lb-card{width:min(1040px,100%);padding:14px;border-radius:20px;background:rgba(20,20,24,.86);border:1px solid rgba(255,255,255,.14)}
.lb-frame{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:#111}
.lb-frame img{width:100%;height:100%;object-fit:contain}
.lb-frame .photo-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#bbb}
.lb-frame.is-missing img{display:none}
.lb-frame.is-missing .photo-ph{display:flex}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px 2px;color:#eee;font-size:14px}
.lb-nav{display:flex;gap:8px}
.lb .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}

/* ============ TOAST ============ */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:100;padding:12px 20px;border-radius:980px;
  background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function djb2(s){ let h=5381; for (const ch of s){ h=((h*33)^ch.codePointAt(0))>>>0; } return h.toString(16).padStart(8,"0"); }
async function sha256(s){
  if (!crypto?.subtle) return null;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const normCode = s => s.trim().toUpperCase().replace(/\s+/g,"");

function photoFigure(key, cls=""){ // фигура фото с плейсхолдером при отсутствии файла
  const [file, alt] = PHOTOS[key];
  return `<figure class="photo ${cls}" data-photo>

  </figure>`;
}
function bindImages(root){ // вешаем error/load: плейсхолдер вместо битой картинки
  $$("img[data-file]", root).forEach(img=>{
    const f = img.dataset.file;
    const frame = img.closest(".photo, .shot-frame, .lb-frame");
    if (missingFiles.has(f)){ frame?.classList.add("is-missing"); return; }
    img.addEventListener("error", ()=>{ missingFiles.add(f); frame?.classList.add("is-missing"); });
    img.addEventListener("load", ()=>frame?.classList.add("is-loaded"));
    if (img.complete && img.naturalWidth>0) frame?.classList.add("is-loaded");
  });
}
function trapTab(e, box){ // фокус-ловушка для модалок
  if (e.key!=="Tab") return;
  const f = $$('button, a[href], input, textarea, [tabindex]:not([tabindex="-1"])', box).filter(el=>!el.disabled && el.offsetParent!==null);
  if (!f.length) return;
  const first=f[0], last=f[f.length-1];
  if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
}

/* ================= GATE: код для перехода на ресурс ================= */
async function verifyCode(raw){ // возвращает {key} / {empty} / {}
  const code = normCode(raw);
  if (!code) return {empty:true};
  const sha = await sha256(code);
  for (const [key,h] of Object.entries(CODE_HASHES)){
    if (sha ? sha===h.sha : djb2(code)===h.djb2) return {key};
  }
  return {};
}
function gateInputHTML(p){

    <div class="field"><label for="gate-input">Код</label><input id="gate-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Например, WEBD-7K42"><span class="gate-err" id="gate-err" aria-live="polite"></span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="gate-ok" type="button">Открыть переход</button>

function openGate(forId){
  state.gateFor = forId; state.attempts = 0; stopCooldown();
  const p = PROJECTS.find(x=>x.id===forId);
  $("#gate-card").className = "modal-card";
  $("#gate-card").innerHTML = gateInputHTML(p);
  $("#gate").classList.add("open"); syncScrollLock();
  state.lastFocus = document.activeElement;
  setTimeout(()=>$("#gate-input")?.focus(), 60);
}
function closeGate(){
  state.gateFor = null; stopCooldown();
  $("#gate").classList.remove("open"); syncScrollLock();
  state.lastFocus?.focus?.();
}
function stopCooldown(){ clearInterval(state.cooldownTimer); state.cooldownTimer=null; state.cooldown=0; }
async function submitGate(){
  if (state.cooldown>0 || !state.gateFor) return;
  const res = await verifyCode($("#gate-input")?.value ?? "");
  if (res.empty){ $("#gate-err").textContent = "Введите код — поле пустое."; shake(); return; }
  if (!res.key){
    state.attempts++;
    if (state.attempts>=5){ startCooldown(); } else { $("#gate-err").textContent = "Неверный код. Уточните у учителя или проверьте символы."; }
    shake(); return;
  }
  // успех: открываем переход
  const isMaster = res.key==="master";
  if (isMaster) PROJECTS.forEach(p=>state.unlocked.add(p.id));
  else state.unlocked.add(res.key);
  saveUnlocked(); syncLockUI();
  if (state.sheetId) renderSheetActions(PROJECTS.find(p=>p.id===state.sheetId));
  const p = PROJECTS.find(x=>x.id===res.key);
  $("#gate-card").innerHTML = gateSuccessHTML(p, isMaster);
  toast(isMaster ? "Мастер-код: открыты все переходы" : "Переход открыт: "+p.title);
  setTimeout(()=>$("#gate-go")?.focus(), 60);
}
function shake(){ const c=$("#gate-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
function startCooldown(){
  state.cooldown = 15;
  const ok=$("#gate-ok"), inp=$("#gate-input");
  if(ok) ok.disabled = true; if(inp) inp.disabled = true;
  const tick = ()=>{ const e=$("#gate-err"); if(e) e.textContent = `Слишком много попыток. Повторите через ${state.cooldown} с.`;
    if (--state.cooldown < 0){ stopCooldown(); state.attempts=0;
      const e2=$("#gate-err"); if(e2) e2.textContent="";
      const ok2=$("#gate-ok"), inp2=$("#gate-input");
      if(ok2) ok2.disabled=false; if(inp2){ inp2.disabled=false; inp2.focus(); } } };
  tick(); state.cooldownTimer = setInterval(tick, 1000);
}

function initSpy(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if (en.isIntersecting){ $$(".nav-links a").forEach(a=>a.classList.toggle("active", a.dataset.spy===en.target.id)); }
  }), {rootMargin:"-40% 0px -55% 0px"});
  ["about","principles","works","school","gallery","contacts"].forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}
function initReveal(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});
  $$(".rv").forEach(el=>io.observe(el));
}

  $("#gate-card").addEventListener("click", e=>{
    if (e.target.closest("#gate-ok")) submitGate();
    else if (e.target.closest("#gate-cancel")) closeGate();
    else if (e.target.closest("#gate-stay")) closeGate();
  });
  // делегирование кликов sheet
  $("#sheet").addEventListener("click", e=>{
    if (e.target.closest("#sheet-close")) closeSheet();
    else if (e.target.closest("#sheet-open")?.tagName==="BUTTON") openGate(state.sheetId);
    else if (e.target.closest("#sheet-lock")){
      const id = state.sheetId; const p = PROJECTS.find(x=>x.id===id);
      state.unlocked.delete(id); saveUnlocked(); syncLockUI(); renderSheetActions(p);
      toast("Переход заблокирован: "+p.title);
    }
  });
  $("#lb-close").addEventListener("click", closeLb);
  $("#lb-prev").addEventListener("click", ()=>stepLb(-1));
  $("#lb-next").addEventListener("click", ()=>stepLb(1));
  $("#lock-all").addEventListener("click", ()=>{ if(!state.unlocked.size){ toast("И так всё заблокировано"); return; } state.unlocked.clear(); saveUnlocked(); syncLockUI(); if(state.sheetId) renderSheetActions(PROJECTS.find(p=>p.id===state.sheetId)); toast("Все переходы заблокированы"); });
  $("#copy-mail").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText("mmmaslikov@gmail.com"); toast("Email скопирован"); }
    catch(e){ toast("Email: mmaslikov@gmail.com"); }
  });
  $("#c-form").addEventListener("submit", submitForm);
  $("#t-again").addEventListener("click", ()=>{ $("#c-thanks").hidden=true; const f=$("#c-form"); f.hidden=false; f.reset(); $("#f-name").focus(); });
  // Escape закрывает верхний слой; Enter в поле кода = отправка
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape"){
      if (state.lb) closeLb();
      else if (state.gateFor) closeGate();
      else if (state.sheetId) closeSheet();
      else if (state.menu){ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); syncScrollLock(); }
    }
    if (state.gateFor && e.key==="Enter" && document.activeElement===$("#gate-input")){ e.preventDefault(); submitGate(); }
    if (state.lb && e.key==="ArrowRight") stepLb(1);
    if (state.lb && e.key==="ArrowLeft") stepLb(-1);
    if (state.gateFor) trapTab(e, $("#gate-card"));
    else if (state.lb) trapTab(e, $(".lb-card"));
    else if (state.sheetId) trapTab(e, $("#sheet"));
  });
  window.addEventListener("hashchange", syncRoute);
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener?.("change", ()=>{ if(state.theme==="auto") applyTheme(); });
}

/* ================= INIT ================= */
function init(){
  try{ const t = localStorage.getItem(LS_THEME); if (t==="light"||t==="dark") state.theme = t; }catch(e){}
  loadUnlocked();
  renderApp();
  bindHandlers();
  applyTheme();
  initSpy(); initReveal();
  syncRoute(); // глубокая ссылка #/dev/<id>
}
init();
</script>
</body>
</html>
