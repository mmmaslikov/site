<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Масликов Михаил Михайлович — учитель информатики ЧОУ «Точка будущего». Курсы, тренажёры и проектные лаборатории: веб-разработка, Python, ЕГЭ и ОГЭ, Turtle, ТПГ «ГенИИ».">
<title>Михаил Масликов — учитель информатики · Точка будущего</title>
<!--
  МАСШТАБ: на экранах ≥1800px сайт автоматически крупнее (zoom 1.25), на ≥2300px — как при 150% (zoom 1.5).
  КОДЫ ДОСТУПА живут только в памяти вкладки: перезагрузил страницу — снова под кодом.
-->
<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --bg:#f2f2f2;
  --m2:#e6e6e6;
  --charcoal:#2f2d2c;
  --hero-acc:#4da3ff;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --text:#1d1d1f; --muted:#6f6f6f;
  --line:rgba(0,0,0,.10);
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10);
  --radius:24px; --radius-s:16px; --shadow:0 12px 34px rgba(0,0,0,.10);
  --nav-h:64px; --ok:#34c759; --err:#ff3b30;
  --pad:clamp(20px,4vw,48px);
  --wrap:1320px;
  --dock-h:64px;
  --zoom:1;
}
@media (min-width:1800px){:root{--zoom:1.25}}
@media (min-width:2300px){:root{--zoom:1.5}}
html{zoom:var(--zoom)}
@media (max-width:759px){:root{--dock-h:132px}}
[data-theme="dark"]{
  --bg:#161616; --m2:#1d1d1d; --charcoal:#232120;
  --hero-acc:#2997ff;
  --surface:#222222; --surface-2:#2a2a2a; --text:#f2f2f2; --muted:#9c9c9c;
  --line:rgba(255,255,255,.12); --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
  --shadow:0 14px 40px rgba(0,0,0,.5);
}
/* цвета проектов (иконки) */
.acc-webdev{--acc-p:#ff9f0a;--acc-soft-p:rgba(255,159,10,.15)}  [data-theme="dark"] .acc-webdev{--acc-p:#ff9f0a;--acc-soft-p:rgba(255,159,10,.24)}
.acc-python{--acc-p:#0a84ff;--acc-soft-p:rgba(10,132,255,.14)}  [data-theme="dark"] .acc-python{--acc-p:#0a84ff;--acc-soft-p:rgba(10,132,255,.24)}
.acc-ege{--acc-p:#ff453a;--acc-soft-p:rgba(255,69,58,.13)}      [data-theme="dark"] .acc-ege{--acc-p:#ff453a;--acc-soft-p:rgba(255,69,58,.24)}
.acc-oge{--acc-p:#ff375f;--acc-soft-p:rgba(255,55,95,.13)}      [data-theme="dark"] .acc-oge{--acc-p:#ff375f;--acc-soft-p:rgba(255,55,95,.24)}
.acc-turtle{--acc-p:#30d158;--acc-soft-p:rgba(48,209,88,.15)}   [data-theme="dark"] .acc-turtle{--acc-p:#30d158;--acc-soft-p:rgba(48,209,88,.24)}
.acc-tpg{--acc-p:#bf5af2;--acc-soft-p:rgba(191,90,242,.15)}     [data-theme="dark"] .acc-tpg{--acc-p:#bf5af2;--acc-soft-p:rgba(191,90,242,.24)}
.sec--m2{background:var(--m2)}

/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:clamp(26px,3.4vw,50px);font-weight:700}
h3{font-size:20px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.sec{padding:clamp(52px,7vw,110px) 0}
.sec-head{margin-bottom:clamp(26px,3vw,48px)}
.sec-head.center{text-align:center;max-width:860px;margin-inline:auto}
.sec-head.center .sec-lead{margin-inline:auto}
.sec-kicker{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-lead{color:var(--muted);margin-top:12px;max-width:720px;font-size:clamp(16px,1.5vw,20px)}
.j{text-align:justify;hyphens:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;
  border-radius:980px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;
  cursor:pointer;text-decoration:none;transition:transform .18s,opacity .18s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--acc-soft-p,var(--accent-soft));color:var(--acc-p,var(--accent))}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:980px;background:var(--surface);
  border:1px solid var(--line);font-size:14px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}

/* ============ NAV ============ */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);
  background:color-mix(in srgb,var(--charcoal) 88%,transparent);backdrop-filter:saturate(140%) blur(18px);
  -webkit-backdrop-filter:saturate(140%) blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);height:var(--nav-h);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;text-decoration:none;color:#fff;min-height:44px}
.logo-m{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0b3ea8,#3f97f0);
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.nav-links{display:none;gap:6px;margin-left:auto}
.nav-links a{color:rgba(255,255,255,.72);text-decoration:none;font-size:15px;font-weight:500;padding:10px 14px;border-radius:980px;min-height:44px;display:inline-flex;align-items:center;border-bottom:2px solid transparent}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.active{color:#fff;border-bottom-color:var(--hero-acc);border-radius:0}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-links + .nav-actions{margin-left:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s;flex:none}
.icon-btn:hover{transform:scale(1.06)}
.nav .icon-btn{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.burger{display:grid}
@media (min-width:960px){.nav-links{display:flex}.burger{display:none}}
.menu{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:49;background:var(--charcoal);border-bottom:1px solid rgba(255,255,255,.1);
  padding:12px var(--pad) 20px;display:grid;gap:4px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.menu a{color:rgba(255,255,255,.85);text-decoration:none;font-size:18px;font-weight:600;padding:12px 14px;border-radius:14px;min-height:48px;display:flex;align-items:center}
.menu a:hover{background:rgba(255,255,255,.08);color:#fff}

/* ============ HERO: уголь, ч/б квадратное фото, низ фото = низ блока ============ */
.hero{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;
  min-height:calc((100vh - var(--nav-h))/var(--zoom));
  min-height:calc((100svh - var(--nav-h))/var(--zoom));
  display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,2vw,36px) 0 0}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 78% 20%,rgba(255,255,255,.06),transparent 60%)}
.hero .wrap{position:relative;z-index:1;width:100%}
.hero-grid{display:grid;gap:clamp(24px,3vw,40px);align-items:end}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.hero-left{padding-bottom:clamp(40px,5vw,76px)}
.hero-name{border-left:2px solid var(--hero-acc);padding-left:clamp(16px,2vw,26px)}
.hero-name h1{font-size:clamp(34px,6.4vw,92px);font-weight:600;color:#fff;letter-spacing:-.03em}
.hero-sub{margin-top:10px;font-size:clamp(15px,1.6vw,20px);color:rgba(255,255,255,.66);letter-spacing:.02em}
.hero-slogan{margin-top:22px;font-size:clamp(16px,1.8vw,22px);color:rgba(255,255,255,.88);max-width:520px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn.line{background:transparent;color:var(--hero-acc);border:1.5px solid var(--hero-acc)}
.btn.line:hover{background:rgba(77,163,255,.14);opacity:1}
.btn.dim{background:transparent;color:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.35)}
.btn.dim:hover{border-color:#fff;color:#fff;opacity:1}
.hero-scroll{display:inline-flex;align-items:center;gap:14px;margin-top:clamp(28px,4vw,52px);
  color:rgba(255,255,255,.65);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.hero-scroll i{display:block;width:44px;height:1.5px;background:rgba(255,255,255,.4)}
.hero-scroll .dn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--hero-acc);color:var(--hero-acc);
  display:grid;place-items:center;transition:transform .2s,background .2s}
.hero-scroll:hover .dn{transform:translateY(3px);background:rgba(77,163,255,.16)}
.hero-scroll:hover{color:#fff}
/* квадратное фото 1:1, ограничено высотой экрана */
.hero-stage{position:relative;width:100%;max-width:min(480px,calc(88svh/var(--zoom)));margin-inline:auto}
@media (min-width:900px){.hero-stage{max-width:min(100%,calc(86svh/var(--zoom)));margin-inline:0 0 0 auto}}
.hero-photo{margin:0;position:relative;aspect-ratio:1/1;overflow:hidden}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  filter:grayscale(1) contrast(1.06);opacity:0;transition:opacity .8s}
.hero-photo.is-loaded img{opacity:1}
.hero-photo.is-missing img{display:none}
.photo-ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:20px;text-align:center;color:var(--muted);background:var(--surface-2);border:1.5px dashed var(--line);border-radius:20px}
.hero-photo .photo-ph{color:rgba(255,255,255,.7);background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3);border-radius:0}
.is-missing .photo-ph{display:flex}
.photo-ph svg{opacity:.6}
.ph-file{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;opacity:.85;word-break:break-all}

/* ============ DOCK ============ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--charcoal) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.14)}
.dock-in{max-width:var(--wrap);margin:0 auto;padding:6px var(--pad);display:flex;align-items:center;justify-content:center;min-height:var(--dock-h)}
.marks{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 8px;width:100%;padding:2px}
.mark{display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-size:15px;font-weight:700;color:rgba(255,255,255,.8);
  background:none;border:0;cursor:pointer;padding:8px 14px;border-radius:12px;min-height:44px;white-space:nowrap;
  transition:color .2s,background .2s}
.mark svg{width:20px;height:20px;color:var(--acc-p,#fff);flex:none}
.mark:hover{color:#fff;background:rgba(255,255,255,.1)}
@media (max-width:759px){
  .marks{gap:4px}
  .mark{flex:1 1 30%;max-width:33.33%;flex-direction:column;gap:5px;font-size:12px;font-weight:600;
    padding:8px 4px;min-height:58px;white-space:normal;text-align:center;line-height:1.15}
  .mark svg{width:18px;height:18px}
}

/* ============ КАРТОЧКИ «ОБО МНЕ» / «СТАНДАРТЫ» ============ */
.two-col{display:grid;gap:16px;max-width:1120px;margin-inline:auto}
@media (min-width:900px){.two-col{grid-template-columns:1fr 1fr}}
.three-col{display:grid;gap:16px;max-width:1180px;margin-inline:auto}
@media (min-width:700px){.three-col{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.three-col{grid-template-columns:repeat(3,1fr)}}
.tcard{padding:clamp(20px,2.4vw,30px);border-radius:20px;background:var(--surface);border:1px solid var(--line);
  display:grid;gap:14px;justify-items:start;box-shadow:var(--shadow);transition:transform .25s}
.tcard:hover{transform:translateY(-3px)}
.t-head{display:flex;align-items:center;gap:14px;width:100%}
.tcard .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--aic) 15%,transparent);color:var(--aic)}
.tcard .ai svg{width:24px;height:24px}
.t-head h3{font-size:19px}
.tcard p{color:var(--muted);font-size:15.5px}
.a-blue{--aic:#0a84ff}.a-slate{--aic:#57606a}.a-teal{--aic:#0d9488}.a-terra{--aic:#b45309}
.a-orange{--aic:#ff9f0a}.a-purple{--aic:#af52de}
[data-theme="dark"] .a-blue{--aic:#0a84ff}[data-theme="dark"] .a-slate{--aic:#9aa4b2}
[data-theme="dark"] .a-teal{--aic:#14b8a6}[data-theme="dark"] .a-terra{--aic:#d97706}
[data-theme="dark"] .a-orange{--aic:#ff9f0a}[data-theme="dark"] .a-purple{--aic:#bf5af2}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}

/* ============ РАЗРАБОТКИ: 3 + 3 ============ */
.cards{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
.pcard{padding:clamp(20px,2.2vw,26px);display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--acc-p)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pcard-ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--acc-soft-p);color:var(--acc-p)}
.pcard-ico svg{width:28px;height:28px}
.lock-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:980px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lock-badge.open{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pcard h3{font-size:21px}
.pcard .tag{color:var(--muted);font-size:15.5px;flex:1}
.pcard-meta{display:flex;flex-wrap:wrap;gap:6px}
.pcard-cta{align-self:flex-start;min-height:48px}

/* ============ ШКОЛА / ТПГ ============ */
.school-cols{max-width:1060px;margin-inline:auto}
.tpg{padding:clamp(22px,2.6vw,34px);border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-top:24px;box-shadow:var(--shadow)}
.tpg-head{display:flex;align-items:center;gap:16px}
.tpg-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:rgba(175,82,222,.15);color:#af52de}
[data-theme="dark"] .tpg-ico{background:rgba(191,90,242,.22);color:#bf5af2}
.tpg-ico svg{width:28px;height:28px}
.tpg ul{margin:16px 0 0;padding:0;list-style:none;color:var(--muted);font-size:16px;display:grid;gap:10px}
.tpg ul li{display:flex;gap:10px;align-items:flex-start}
.tpg ul li svg{flex:none;width:19px;height:19px;color:var(--accent);margin-top:4px}
.tpg-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ============ ГАЛЕРЕЯ ============ */
.gal-grid{display:grid;gap:16px;grid-template-columns:1fr;max-width:520px;margin-inline:auto}
@media (min-width:560px){.gal-grid{grid-template-columns:repeat(2,1fr);max-width:none}}
@media (min-width:900px){.gal-grid{grid-template-columns:repeat(3,1fr)}}
.gal-card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;
  display:grid;box-shadow:var(--shadow);transition:transform .25s}
.gal-card:hover{transform:translateY(-4px)}
.gal-photo{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.gal-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;
  opacity:0;transition:opacity .6s,transform .6s}
.gal-photo.is-loaded img{opacity:1}
.gal-photo.is-missing img{display:none}
.gal-card:hover .gal-photo img{transform:scale(1.05)}
.gal-cap{margin-top:12px;padding:12px 8px;border-top:1px solid var(--line);
  font-size:14.5px;font-weight:500;color:var(--muted);text-align:center;
  min-height:64px;display:flex;align-items:center;justify-content:center}

/* ============ FOOTER ============ */
.footer{border-top:1px solid rgba(255,255,255,.1);
  padding:clamp(40px,5vw,64px) 0 calc(clamp(40px,5vw,64px) + var(--dock-h) + 12px);
  background:var(--charcoal);color:#fff}
.footer-in{display:grid;justify-items:center;gap:22px;text-align:center}
.f-title{font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-.02em;color:#fff}
.f-contacts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.crow{display:flex;align-items:stretch;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:rgba(255,255,255,.05);
  overflow:hidden;transition:border-color .2s,transform .2s;flex:0 1 340px;min-width:min(280px,100%)}
.crow:hover{border-color:var(--hero-acc);transform:translateY(-2px)}
.crow-a{flex:1;display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:60px;text-decoration:none;color:#fff}
.ci{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;
  background:rgba(77,163,255,.16);color:var(--hero-acc)}
.ci svg{width:21px;height:21px}
.ct{display:grid;line-height:1.3;min-width:0;text-align:left}
.ct small{font-size:12.5px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ct b{font-size:16px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cext{color:rgba(255,255,255,.55);margin-left:auto;flex:none}
.copy-mini{width:54px;flex:none;border:0;border-left:1px solid rgba(255,255,255,.16);background:transparent;color:rgba(255,255,255,.6);
  cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.copy-mini svg{width:19px;height:19px}
.copy-mini:hover{color:var(--hero-acc);background:rgba(77,163,255,.14)}
.f-copy{color:rgba(255,255,255,.6);font-size:15.5px}

/* ============ SHEET ============ */
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:var(--nav-h);padding:0 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
.sheet-bar .icon-btn{background:var(--surface);border-color:var(--line);color:var(--text)}

.sheet-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.note{padding:18px 20px;border-radius:14px;background:var(--acc-soft-p,var(--accent-soft));font-size:15.5px;color:var(--text)}

/* ============ МОДАЛКИ ============ */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;

.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:min(480px,100%);padding:clamp(20px,5vw,30px);border-radius:26px;background:var(--surface);border:1px solid var(--line);

.modal.open .modal-card{transform:none}
.modal-card.shake{animation:shake .4s}

.gate-ico.unlocked{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.gate-err{font-size:14px;color:var(--err);min-height:20px}
.gate-hint{font-size:15px;color:var(--muted)}
.field{display:grid;gap:7px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}

.toast.show{opacity:1;transform:translate(-50%,0)}

  unlocked: new Set(),   // только в памяти вкладки
  sheetId: null, gateFor: null,
  attempts: 0, cooldown: 0, cooldownTimer: null,
  lb: null, menu: false, theme: "auto", lastFocus: null
};
const missingFiles = new Set();

/* ================= УТИЛИТЫ ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function djb2(s){ let h=5381; for (const ch of s){ h=((h*33)^ch.codePointAt(0))>>>0; } return h.toString(16).padStart(8,"0"); }
async function sha256(s){
  if (!crypto?.subtle) return null;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const normCode = s => s.trim().toUpperCase().replace(/\s+/g,"");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function bindImages(root){
  $$("img[data-file]", root).forEach(img=>{
    const f = img.dataset.file;
    const frame = img.closest(".hero-photo, .gal-photo, .shot-frame, .lb-frame");
    if (missingFiles.has(f)){ frame?.classList.add("is-missing"); return; }
    img.addEventListener("error", ()=>{ missingFiles.add(f); frame?.classList.add("is-missing"); });
    img.addEventListener("load", ()=>frame?.classList.add("is-loaded"));
    if (img.complete && img.naturalWidth>0) frame?.classList.add("is-loaded");
  });
}
function trapTab(e, box){
  if (e.key!=="Tab") return;
  const f = $$('button, a[href], input, textarea, [tabindex]:not([tabindex="-1"])', box).filter(el=>!el.disabled && el.offsetParent!==null);
  if (!f.length) return;
  const first=f[0], last=f[f.length-1];
  if (e.shiftKey && document.activeElement===first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
}
function syncScrollLock(){ document.body.classList.toggle("lock", !!(state.sheetId||state.gateFor||state.lb||state.menu)); }

/* ================= GATE ================= */
async function verifyCode(raw){
  const code = normCode(raw);
  if (!code) return {empty:true};
  const sha = await sha256(code);
  for (const [key,h] of Object.entries(CODE_HASHES)){
    if (sha ? sha===h.sha : djb2(code)===h.djb2) return {key};
  }
  return {};
}
function gateInputHTML(p){
  return `
    <span class="gate-ico acc-${p.id}">${ICONS.lock}</span>
    <h3 id="gate-title">Код доступа · ${esc(p.title)}</h3>
    <p class="gate-hint">Описание и скриншоты открыты всем. Переход на сам ресурс — по коду доступа: его выдаёт лично М. М. Масликов ученикам и сотрудникам.</p>
    <div class="field"><label for="gate-input">Код</label><input id="gate-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Введите код доступа"><span class="gate-err" id="gate-err" aria-live="polite"></span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="gate-ok" type="button">Открыть переход</button>
      <button class="btn ghost" id="gate-cancel" type="button">Отмена</button>
    </div>`;
}
function gateSuccessHTML(p, isMaster){
  const link = isMaster ? "" : `<a class="btn" id="gate-go" href="${p.url}" target="_blank" rel="noopener">Перейти к ресурсу ${ICONS.ext}</a>`;
  return `
    <span class="gate-ico unlocked">${ICONS.check}</span>
    <h3 id="gate-title">Доступ открыт</h3>
    <p class="gate-hint">${isMaster ? "Мастер-код принят: переходы доступны ко всем ресурсам." : "Код принят. Переход на ресурс «"+esc(p.title)+"» доступен."}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${link}
      <button class="btn ghost" id="gate-stay" type="button">Остаться на сайте</button>
    </div>`;
}
function openGate(forId){
  state.gateFor = forId; state.attempts = 0; stopCooldown();
  $("#gate-card").className = "modal-card";
  $("#gate-card").innerHTML = gateInputHTML(PROJECTS.find(x=>x.id===forId));
  $("#gate").classList.add("open"); syncScrollLock();
  state.lastFocus = document.activeElement;
  setTimeout(()=>$("#gate-input")?.focus(), 60);
}
function closeGate(){
  state.gateFor = null; stopCooldown();
  $("#gate").classList.remove("open"); syncScrollLock();
  state.lastFocus?.focus?.();
}
function stopCooldown(){ clearInterval(state.cooldownTimer); state.cooldownTimer=null; state.cooldown=0; }
async function submitGate(){
  if (state.cooldown>0 || !state.gateFor) return;
  const res = await verifyCode($("#gate-input")?.value ?? "");
  if (res.empty){ $("#gate-err").textContent = "Введите код — поле пустое."; shake(); return; }
  if (!res.key){
    state.attempts++;
    if (state.attempts>=5){ startCooldown(); } else { $("#gate-err").textContent = "Неверный код. Уточните у учителя или проверьте символы."; }
    shake(); return;
  }
  const isMaster = res.key==="master";
  if (isMaster) PROJECTS.forEach(p=>state.unlocked.add(p.id));
  else state.unlocked.add(res.key);
  syncLockUI();
  if (state.sheetId) renderSheetActions(PROJECTS.find(p=>p.id===state.sheetId));
  const p = PROJECTS.find(x=>x.id===res.key);
  $("#gate-card").innerHTML = gateSuccessHTML(p, isMaster);
  toast(isMaster ? "Мастер-код: открыты все переходы" : "Переход открыт: "+p.title);
  setTimeout(()=>$("#gate-go")?.focus(), 60);
}
function shake(){ const c=$("#gate-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
function startCooldown(){
  state.cooldown = 15;
  const ok=$("#gate-ok"), inp=$("#gate-input");
  if(ok) ok.disabled = true; if(inp) inp.disabled = true;
  const tick = ()=>{ const e=$("#gate-err"); if(e) e.textContent = `Слишком много попыток. Повторите через ${state.cooldown} с.`;
    if (--state.cooldown < 0){ stopCooldown(); state.attempts=0;
      const e2=$("#gate-err"); if(e2) e2.textContent="";
      const ok2=$("#gate-ok"), inp2=$("#gate-input");
      if(ok2) ok2.disabled=false; if(inp2){ inp2.disabled=false; inp2.focus(); } } };
  tick(); state.cooldownTimer = setInterval(tick, 1000);
}

}
function renderSheetActions(p){
  const box = $("#sheet-actions");
  if (box) box.innerHTML = sheetActionsHTML(p);
  syncLockUI();
}
function openSheet(id){
  const p = PROJECTS.find(x=>x.id===id); if(!p) return;
  state.sheetId = id;
  history.replaceState(null,"","#/dev/"+id);
  const sheet = $("#sheet");
  sheet.className = "sheet acc-"+p.id;
  const kicker = p.status ? `Разработка · ${esc(p.status)}` : "Разработка";
  sheet.innerHTML = `
    <div class="sheet-bar">
      <button class="icon-btn" id="sheet-close" type="button" aria-label="Закрыть">${ICONS.close}</button>
      <strong style="font-size:16px">${esc(p.title)}</strong>
      <span class="lock-badge" id="sheet-linkbadge" style="margin-left:auto"></span>
    </div>
    <div class="sheet-body">
      <div class="sheet-hero">
        <span class="sec-kicker">${kicker}</span>
        <h2 id="sheet-title">${esc(p.title)}</h2>
        <p class="sec-lead">${esc(p.tagline)}</p>
        <div class="chip-row"><span class="chip">${esc(p.audience)}</span><span class="chip">${esc(p.volume)}</span><span class="chip">Автор: Масликов М. М.</span></div>
      </div>
      <div class="sheet-sec"><h3>Что это</h3>${p.about.map(t=>`<p class="j" style="color:var(--muted);margin-bottom:12px;font-size:16.5px">${esc(t)}</p>`).join("")}</div>
      <div class="sheet-sec"><h3>Что внутри</h3>
        <ul style="margin:0;padding-left:22px;color:var(--muted);display:grid;gap:9px;font-size:16px">${p.inside.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
      </div>
      <div class="sheet-sec"><h3>Скриншоты</h3>
        <div class="shots">${p.shots.map((s,i)=>`
          <figure class="shot">
            <div class="shot-frame"><img data-file="${s[0]}" src="${IMG}${s[0]}" alt="${esc(s[1])} — скриншот ресурса «${esc(p.title)}»" loading="lazy" decoding="async" data-lb="${i}">
              <div class="photo-ph" aria-hidden="true">${ICONS.cam}<span class="ph-file">${IMG}${s[0]}</span></div></div>
            <figcaption>${esc(s[1])}</figcaption>
          </figure>`).join("")}</div>
      </div>
      <div class="sheet-sec"><div class="note">Описание и скриншоты открыты без кода. Кнопка «Открыть ресурс» становится доступна после ввода кода доступа — код выдаёт лично учитель.</div></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>`;
  renderSheetActions(p);
  requestAnimationFrame(()=>sheet.classList.add("open"));
  syncScrollLock(); bindImages(sheet);
  $$("img[data-lb]", sheet).forEach(img=>img.addEventListener("click", ()=>openLb(id, +img.dataset.lb)));
  state.lastFocus = document.activeElement;
  setTimeout(()=>$("#sheet-close").focus(), 80);
}
function closeSheet(){
  const sheet = $("#sheet");
  if (!state.sheetId) return;
  state.sheetId = null;
  sheet.classList.remove("open"); syncScrollLock();
  history.replaceState(null,"",location.pathname+location.search);
  setTimeout(()=>{ if(!state.sheetId) sheet.innerHTML=""; }, 450);
  state.lastFocus?.focus?.();
}

/* ================= LIGHTBOX ================= */
function openLb(pid, idx){
  state.lb = {pid, idx}; state.lastFocus = document.activeElement;
  drawLb(); $("#lb").classList.add("open"); syncScrollLock(); setTimeout(()=>$("#lb-close").focus(),60);
}
function drawLb(){
  const p = PROJECTS.find(x=>x.id===state.lb.pid); const [file, cap] = p.shots[state.lb.idx];
  const frame = $("#lb-frame");
  frame.className = "lb-frame" + (missingFiles.has(file) ? " is-missing" : "");
  frame.innerHTML = `<img src="${IMG}${file}" alt="${esc(cap)} — увеличенный скриншот">
    <div class="photo-ph">${ICONS.cam}<span class="ph-file">${IMG}${file}</span></div>`;
  bindImages(frame);
  $("#lb-cap").textContent = `${p.title} · ${state.lb.idx+1} / ${p.shots.length} — ${cap}`;
}
function stepLb(d){ const p=PROJECTS.find(x=>x.id===state.lb.pid); state.lb.idx=(state.lb.idx+d+p.shots.length)%p.shots.length; drawLb(); }
function closeLb(){ state.lb=null; $("#lb").classList.remove("open"); syncScrollLock(); state.lastFocus?.focus?.(); }

/* ================= ТЕМА ================= */
function resolvedTheme(){ return state.theme==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : state.theme; }
function applyTheme(){ document.documentElement.dataset.theme = resolvedTheme();
  $("#theme-btn").innerHTML = resolvedTheme()==="dark" ? ICONS.sun : ICONS.moon;
  $("#theme-btn").setAttribute("aria-label", resolvedTheme()==="dark"?"Светлая тема":"Тёмная тема"); }
function toggleTheme(){ state.theme = resolvedTheme()==="dark" ? "light" : "dark";
  try{ localStorage.setItem(LS_THEME, state.theme); }catch(e){} applyTheme(); }

/* ================= ROUTER / SPY / REVEAL ================= */
function hashProjectId(){ const m = location.hash.match(/^#\/dev\/([a-z]+)/); return m ? m[1] : null; }
function syncRoute(){
  const id = hashProjectId();
  if (id && PROJECTS.some(p=>p.id===id)){ if (state.sheetId!==id) openSheet(id); }
  else if (!id && state.sheetId) closeSheet();
}
function initSpy(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{
    if (en.isIntersecting){ $$(".nav-links a").forEach(a=>a.classList.toggle("active", a.dataset.spy===en.target.id)); }
  }), {rootMargin:"-40% 0px -55% 0px"});
  ["about","works","standards","school","gallery","contacts"].forEach(id=>{ const el=document.getElementById(id); if(el) io.observe(el); });
}
function initReveal(){
  const io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), {threshold:.12});
  $$(".rv").forEach(el=>io.observe(el));
}

/* ================= HANDLERS ================= */
function bindHandlers(){
  $("#theme-btn").addEventListener("click", toggleTheme);
  $("#burger").addEventListener("click", ()=>{ state.menu=!state.menu; $("#menu").classList.toggle("open",state.menu); $("#burger").setAttribute("aria-expanded",String(state.menu)); syncScrollLock(); });
  $$("#menu a").forEach(a=>a.addEventListener("click", ()=>{ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); syncScrollLock(); }));
  document.addEventListener("click", e=>{
    const t = e.target.closest("[data-open]");
    if (t) openSheet(t.dataset.open);
  });
  $("#gate-card").addEventListener("click", e=>{
    if (e.target.closest("#gate-ok")) submitGate();
    else if (e.target.closest("#gate-cancel")) closeGate();
    else if (e.target.closest("#gate-stay")) closeGate();
  });
  $("#sheet").addEventListener("click", e=>{
    if (e.target.closest("#sheet-close")) closeSheet();
    else if (e.target.closest("#sheet-open")?.tagName==="BUTTON") openGate(state.sheetId);
  });
  $("#lb-close").addEventListener("click", closeLb);
  $("#lb-prev").addEventListener("click", ()=>stepLb(-1));
  $("#lb-next").addEventListener("click", ()=>stepLb(1));
  $("#copy-mail").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(ME+"@gmail.com"); toast("Email скопирован"); }
    catch(e){ toast("Email: "+ME+"@gmail.com"); }
  });
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape"){
      if (state.lb) closeLb();
      else if (state.gateFor) closeGate();
      else if (state.sheetId) closeSheet();
      else if (state.menu){ state.menu=false; $("#menu").classList.remove("open"); $("#burger").setAttribute("aria-expanded","false"); syncScrollLock(); }
    }
    if (state.gateFor && e.key==="Enter" && document.activeElement===$("#gate-input")){ e.preventDefault(); submitGate(); }
    if (state.lb && e.key==="ArrowRight") stepLb(1);
    if (state.lb && e.key==="ArrowLeft") stepLb(-1);
    if (state.gateFor) trapTab(e, $("#gate-card"));
    else if (state.lb) trapTab(e, $(".lb-card"));
    else if (state.sheetId) trapTab(e, $("#sheet"));
  });
  window.addEventListener("hashchange", syncRoute);
  const mq = matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener?.("change", ()=>{ if(state.theme==="auto") applyTheme(); });
}

/* ================= INIT ================= */
function init(){
  try{ const t = localStorage.getItem(LS_THEME); if (t==="light"||t==="dark") state.theme = t; }catch(e){}
  renderApp();
  bindHandlers();
  applyTheme();
  initSpy(); initReveal();
  syncRoute();
}
init();
</script>
</body>
</html>
